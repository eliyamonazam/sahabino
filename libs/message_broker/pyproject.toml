[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "message-broker"
version = "0.1.0"
description = "Shared publish/consume abstraction over Redis Streams and Kafka"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0,<6.0",
    "aiokafka>=0.11,<0.12",
]

[tool.setuptools.packages.find]
include = ["message_broker*"]
