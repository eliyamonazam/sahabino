services:
  postgres:
    image: postgres:16
    container_name: sahabino-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: sahabino-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka runs in KRaft mode (no separate Zookeeper container needed).
  # KRaft is the modern, officially recommended mode for new Kafka deployments
  # and simplifies local/dev setups by removing a service from the stack.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sahabino-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for container-to-container traffic (advertised
      # as the `kafka` service name, resolvable on the compose network) and
      # PLAINTEXT_HOST for host-side access (advertised as localhost, mapped
      # to the host port). Without this split, Kafka's post-bootstrap metadata
      # always points every client at the same advertised address, so whichever
      # one isn't advertised can complete the initial connection but never
      # produce/consume -- this broke playstore-scraper/storage-consumer's
      # container-to-container Kafka traffic until the split was added.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  metabase:
    image: metabase/metabase:latest
    container_name: sahabino-metabase
    restart: unless-stopped
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  app-list-api-fastapi:
    build:
      context: ./services/app-list-api-fastapi
    container_name: sahabino-app-list-api-fastapi
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # Always 5432 here regardless of the host-side POSTGRES_PORT in .env:
      # this is container-to-container traffic on the internal docker network,
      # which always uses the port postgres listens on inside its own container.
      POSTGRES_PORT: 5432
    ports:
      - "${APP_LIST_API_FASTAPI_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  app-list-api-django:
    build:
      context: ./services/app-list-api-django
    container_name: sahabino-app-list-api-django
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # Always 5432 here regardless of the host-side POSTGRES_PORT in .env:
      # this is container-to-container traffic on the internal docker network,
      # which always uses the port postgres listens on inside its own container.
      POSTGRES_PORT: 5432
    ports:
      - "${APP_LIST_API_DJANGO_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  playstore-scraper:
    build:
      context: .
      dockerfile: services/playstore-scraper/Dockerfile
    container_name: sahabino-playstore-scraper
    restart: unless-stopped
    environment:
      APP_LIST_API_URL: http://app-list-api-fastapi:8000
      MESSAGE_BROKER_TYPE: ${MESSAGE_BROKER_TYPE:-redis}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-3600}
    depends_on:
      app-list-api-fastapi:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  storage-consumer:
    build:
      context: .
      dockerfile: services/storage-consumer/Dockerfile
    container_name: sahabino-storage-consumer
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # Always 5432 here regardless of the host-side POSTGRES_PORT in .env:
      # this is container-to-container traffic on the internal docker network,
      # which always uses the port postgres listens on inside its own container.
      POSTGRES_PORT: 5432
      MESSAGE_BROKER_TYPE: ${MESSAGE_BROKER_TYPE:-redis}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # No dependency on app-list-api-fastapi: this service only reads from
    # the broker, never calls the API directly.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
