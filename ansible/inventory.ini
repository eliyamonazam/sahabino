# No real remote server is available yet, so this targets the local
# machine directly (ansible_connection=local skips SSH entirely - Ansible
# just runs each task as a local subprocess). To point this at a real
# server once one is available, replace the line below with that host's
# address/alias and drop ansible_connection=local (add ansible_user= and
# whatever SSH key settings the host needs instead) - see ansible/README.md.
[sahabino]
localhost ansible_connection=local
